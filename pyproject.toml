[project]
name = "video2slides"
version = "0.1.0"
description = "Convert MP4 videos into editable, professionally designed PowerPoint presentations."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "faster-whisper>=1.1,<2",
    "python-pptx>=1.0,<2",
    "Pillow>=10.3",
    "yt-dlp>=2026.8.19",
    "yt-dlp-ejs>=0.8",  # YouTube challenge solver; needs deno or node on PATH
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that need ffmpeg, the Whisper model or network access",
]
